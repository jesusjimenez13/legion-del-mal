name: Comunicador de la Legión

on:
  workflow_dispatch:

    inputs:
      villano:
        description: '¿Qué villano envía el mensaje?'
        required: true
        type: choice
        options: 
          - Lex Luthor
          - Magneto
          - Joker
          - Mystique
          - Brainiac

      cow_character:
        description: 'Mensaje para el consejo'
        required: true
        type: choice
        options:
          - mule
          - ackbar
          - banana
          - charizardvice
          - homer
       

      mensaje:
        description: 'Mensaje para el consejo'
        required: true
        default: 'La misión fue un éxito'

      prioridad:
        description: 'Nivel del prioridad '
        required: true
        type: choice
        options: 
          - 🟢 Normal
          - 🟠 Alta
          - 🔴 Crítica

jobs:
  transmitir-mensaje:
    runs-on: ubuntu-latest

    steps:

      - name: Instalar el transmisor de la legión
        run: sudo apt-get install -y cowsay

      - name: Imprimir inputs
        run: |
          echo "================================"
          echo "    Transmisión interceptada"
          echo "================================"
          echo ""
          echo "De: ${{ inputs.villano }}"
          echo ""
          echo "Fecha: $(date -u +"%d/%m/%Y - %H:%M UTC")"
          echo "---- Mensaje ----"
          cowsay -f "${{ inputs.cow_character }}"
          echo ""
          echo "--- ${{ inputs.villano }}"
          echo "..."
